name: Update auction data

on:
  schedule:
    - cron: "12 15 * * 1"   # weekly, Mondays about 8:12 AM Pacific
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test alert email"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["fetch_data.py", "enrich.py", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest data from the Clark County Treasurer
        run: python fetch_data.py
      - name: Add Assessor details for new parcels (type, town, location, ownership history)
        run: python enrich.py
      - name: Email alert if an auction date is posted (weekly reminders until the sale)
        if: github.event_name != 'push'
        env:
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_TEST: ${{ inputs.send_test_email }}
        run: python notify.py
      - name: Commit if anything changed
        run: |
          git config user.name "auction-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auctions.json parcels.json
          [ -f alert_state.json ] && git add alert_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            if git diff --cached auctions.json parcels.json | grep -E '^[+-] ' | grep -vqE '"last(Checked|Changed)"'; then
              msg="Auction data updated from county site"
            else
              msg="Weekly data check: no county changes"
            fi
            git commit -m "$msg ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
