name: Update auction data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_data.py", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest data from the Clark County Treasurer
        run: python fetch_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "auction-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auctions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            if git diff --cached auctions.json | grep -E '^[+-] ' | grep -vqE '"last(Checked|Changed)"'; then
              msg="Auction data updated from county site"
            else
              msg="Data check: no county changes"
            fi
            git commit -m "$msg ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
